spring:
  application:
    name: task-scheduler

  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/taskdb?serverTimezone=UTC
    username: taskuser
    password: taskpass
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by init.sql
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # API messages (e.g. validation errors) in English regardless of the
  # machine's or the client's language
  web:
    locale: en
    locale-resolver: fixed

  # Redis (Spring Boot 3 uses spring.data.redis, not spring.redis)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms        # give up on a stuck Redis quickly and read MySQL instead
  cache:
    type: redis             # fail at startup instead of silently caching in memory

# RocketMQ
rocketmq:
  name-server: localhost:9876
  producer:
    group: task-scheduler-producer
    send-message-timeout: 3000

# Swagger UI: document success responses as application/json instead of */*
# (affects the docs only, not what the API returns)
springdoc:
  default-produces-media-type: application/json

app:
  scheduler:
    enabled: true             # tests turn this off so the poller does not race with them
    topic: task-schedule-topic
    poll-interval-ms: 1000
    batch-size: 100           # max due tasks handled per poll
  cache:
    task-ttl: 1m              # bounds how long a stale entry can be served (see CacheConfig)
